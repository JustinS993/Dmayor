<section>
  <h2>Resumen</h2>
  <p>El <strong>TRL</strong> (Technology Readiness Level) es una escala utilizada para evaluar el grado de madurez de una tecnología en desarrollo. Se emplea a nivel industrial, académico y gubernamental para tomar decisiones sobre inversión, planificación de proyectos y gestión del riesgo técnico.</p>
